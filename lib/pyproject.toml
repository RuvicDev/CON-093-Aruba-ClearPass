[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-aruba-clearpass-connector"
version = "1.0.0"
description = "Control de acceso a la red con Aruba ClearPass: consultar endpoints, autorizar dispositivos, revocar acceso y consultar o desconectar sesiones"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_aruba_clearpass_connector*"]
